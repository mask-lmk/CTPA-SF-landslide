# 方向6: BiFPN-Neck — 加权特征融合颈 (EfficientDet CVPR2020)
# 将标准FPN的3处Concat全部替换为BiFPN_Concat (可学习权重)
# 每个融合点2个可学习权重 (归一化: w_i = ReLU(w_i) / sum(ReLU(w)))
# 数学保证: 权重可退化为均等(各0.5), 不会比标准FPN差
# 参数增量: 6个权重参数 (3处 x 2权重)

nc: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 1, CNNTransformerParallel, [1024]]      # 8
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 2, C2PSA, [1024]]                        # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, BiFPN_Concat, [1]]               # 12 BiFPN加权融合 (替代Concat)
  - [-1, 2, C3k2, [512, False]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, BiFPN_Concat, [1]]               # 15 BiFPN加权融合 (替代Concat)
  - [-1, 2, C3k2, [256, False]]                   # 16
  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, BiFPN_Concat, [1]]              # 18 BiFPN加权融合 (替代Concat)
  - [-1, 2, C3k2, [512, False]]                   # 19
  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, BiFPN_Concat, [1]]              # 21 BiFPN加权融合
  - [-1, 2, C3k2, [1024, True]]                   # 22
  - [[16, 19, 22], 1, Detect, [nc]]               # 23
