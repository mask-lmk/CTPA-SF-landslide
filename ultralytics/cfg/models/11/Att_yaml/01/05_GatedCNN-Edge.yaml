# 方向5: GatedCNN-Edge — 滑坡边缘检测专项
# Backbone P5: GatedCNNBlock (门控抑制背景噪声, 强化滑坡边缘)
# Neck: DPA双池化注意力精炼P3/P4/P5
# 适合滑坡场景: 复杂地形背景抑制 + 边界增强 + 多尺度通道校准

nc: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 1, CNNTransformerParallel, [1024]]      # 8
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 1, GatedCNNBlock, []]                     # 10 GatedCNN (门控抑制背景+强化边缘)
  - [-1, 2, C2PSA, [1024]]                        # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                     # 13
  - [-1, 2, C3k2, [512, False]]                   # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                     # 16
  - [-1, 2, C3k2, [256, False]]                   # 17
  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 14], 1, Concat, [1]]                    # 19
  - [-1, 2, C3k2, [512, False]]                   # 20
  - [-1, 1, Conv, [512, 3, 2]]                    # 21
  - [[-1, 11], 1, Concat, [1]]                    # 22
  - [-1, 2, C3k2, [1024, True]]                   # 23
  - [17, 1, DPA, []]                               # 24 DPA neck P3
  - [20, 1, DPA, []]                               # 25 DPA neck P4
  - [23, 1, DPA, []]                               # 26 DPA neck P5
  - [[24, 25, 26], 1, Detect, [nc]]               # 27
