# Ultralytics YOLO11-pose keypoints/pose estimation model with P3/8 - P5/32 outputs

nc: 1

scales:
  n: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [48, 3, 2]]
  - [-1, 1, Conv, [96, 3, 2]]
  - [-1, 2, C3k2, [192, False, 0.25]]
  - [-1, 1, Conv, [192, 3, 2]]
  - [-1, 2, C3k2, [384, False, 0.25]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 2, C3k2, [384, True]]
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 1, CNNTransformerParallel, [768]]
  - [-1, 1, SPPF, [768, 5]]
  - [-1, 1, C2PSA, [768]]


head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [384, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [192, False]]

  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [384, False]]

  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]

  - [[16, 19, 22], 1, Detect, [nc]]



