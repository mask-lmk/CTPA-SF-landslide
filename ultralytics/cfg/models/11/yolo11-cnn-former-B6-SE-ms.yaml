# yolo11-cnn-former-B6-SE-ms: SE多尺度替代DAAFM
# 策略: 用轻量SE替换重量DAAFM + backbone P3/P4/P5多尺度SE增强
# 参数: 极低增量(SE仅2K/module), 多尺度增强弥补精度

nc: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, SE, [16]]                             # 5 SE @ P3
  - [-1, 1, Conv, [512, 3, 2]]                   # 6-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 7
  - [-1, 1, SE, [16]]                             # 8 SE @ P4
  - [-1, 1, Conv, [1024, 3, 2]]                  # 9-P5/32
  - [-1, 1, CNNTransformerParallel, [1024]]      # 10
  - [-1, 1, SPPF, [1024, 5]]                     # 11
  - [-1, 1, SE, [16]]                             # 12 SE @ P5 (替代DAAFM, 极轻量)
  - [-1, 2, C2PSA, [1024]]                        # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 8], 1, Concat, [1]]                     # 15 cat backbone P4 (SE输出)
  - [-1, 2, C3k2, [512, False]]                   # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17
  - [[-1, 5], 1, Concat, [1]]                     # 18 cat backbone P3 (SE输出)
  - [-1, 2, C3k2, [256, False]]                   # 19
  - [-1, 1, Conv, [256, 3, 2]]                    # 20
  - [[-1, 16], 1, Concat, [1]]                    # 21
  - [-1, 2, C3k2, [512, False]]                   # 22
  - [-1, 1, Conv, [512, 3, 2]]                    # 23
  - [[-1, 13], 1, Concat, [1]]                    # 24
  - [-1, 2, C3k2, [1024, True]]                   # 25
  - [[19, 22, 25], 1, Detect, [nc]]               # 26
