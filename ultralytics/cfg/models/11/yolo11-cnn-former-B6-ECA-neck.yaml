# yolo11-cnn-former-B6-ECA-neck: ECA backbone + neck轻量增强
# 策略: ECA(极轻量1D卷积通道注意力) + 多尺度neck ECA精炼
# ECA参数近乎为零(k_size=3的1D Conv), 但通道注意力效果显著

nc: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 1, CNNTransformerParallel, [1024]]      # 8
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 1, ECA, []]                                # 10 ECA @ P5 (~0 params)
  - [-1, 2, C2PSA, [1024]]                        # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 6], 1, Concat, [1]]                     # 13
  - [-1, 2, C3k2, [512, False]]                   # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 4], 1, Concat, [1]]                     # 16
  - [-1, 2, C3k2, [256, False]]                   # 17
  - [-1, 1, Conv, [256, 3, 2]]                    # 18
  - [[-1, 14], 1, Concat, [1]]                    # 19
  - [-1, 2, C3k2, [512, False]]                   # 20
  - [-1, 1, Conv, [512, 3, 2]]                    # 21
  - [[-1, 11], 1, Concat, [1]]                    # 22
  - [-1, 2, C3k2, [1024, True]]                   # 23
  - [17, 1, ECA, []]                                # 24 ECA neck P3
  - [20, 1, ECA, []]                                # 25 ECA neck P4
  - [23, 1, ECA, []]                                # 26 ECA neck P5
  - [[24, 25, 26], 1, Detect, [nc]]               # 27
